# Gera a narração com a Fish Audio (a chave fica no segredo FISH_API_KEY).
# Disparo: push de um arquivo novo em tts/jobs/<slug>.json (feito por pipeline/fish.sh).
name: fish-tts
on:
  push:
    paths: ["tts/jobs/*.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fish-tts
  cancel-in-progress: false
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar áudios pendentes
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
        run: python3 pipeline/fish_tts.py
      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tts/
          git diff --cached --quiet && exit 0
          git commit -m "fish-tts: áudios gerados"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
