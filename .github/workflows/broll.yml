# Baixa clipes de vídeo (Pexels com o segredo PEXELS_API_KEY; sem ele, Wikimedia Commons) para a moldura.
# Disparo: push de broll/jobs/<slug>.json (feito por pipeline/broll.sh).
name: broll
on:
  push:
    paths: ["broll/jobs/*.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: broll
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Baixar clipes
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python3 pipeline/broll_fetch.py
      - name: Salvar no repositório
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add broll/
          git diff --cached --quiet && exit 0
          git commit -m "broll: clipes baixados"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
